# voice.yaml — 语音引擎配置（26 契约 C.5；引擎进程读，DSH 侧 overlay 存 ~/.dsh/hermit-voice-config.json）
# 仅绑定回环（03 §7.1）。阈值可被 voice_config 工具热更（写回 DSH 侧 overlay）。
port: 8300
healthz_port: 8301
debug: true            # 保留假件注入族（debug.*）供协议回归测试；D4 全真件后评估关闭
endpoint:
  acoustic_ms: 600     # 声学端点阈值（12 §二）＝ recognizer rule2 尾静音
  semantic_wait_ms: 1200
asr:
  mode: auto           # auto=真件优先,模型缺失回退 fake | real=强真件(失败即退) | fake=假件
  models_dir: models/voice      # 相对仓库根（server.py 锚定 Hermit/，不受 CWD 影响）
mic:
  enabled: true        # 引擎启动即开麦（失败只降级不致命,报 E_MIC_BUSY）
wake:
  enabled: true        # 关=全开转写（调试档）；真关闭监听用 mic.set muted
  engine: sherpa-onnx  # 26 §8.1 拍板：开放词表 KWS（D3 落地）
  keywords_file: configs/kws-keywords.txt   # 相对仓库根；gen_keywords.py 生成
  dialog_window_s: 30  # 免唤醒窗（12 §五.2）；窗内免唤醒，对话态每次 final 刷新
voice_preset: 官方预设   # 决策点 1 拍板（2026-08-20）：官方预设先行，克隆后续
hotwords: configs/hotwords.yaml
auto_start: false      # 插件不自动拉引擎（26 §C.4）；手工 runtime/start-voice.ps1
fake:                  # 假件延迟模拟（asr 假件仅 debug 注入用；tts 假件 D4 替换）
  asr_partial_ms: 90
  asr_final_ms: 220
  tts_first_ms: 90
  tts_per_char_ms: 40
