# 小寄 agent preset —— 常驻用户侧的多模态交互中枢（Hermit·寄居蟹）。
# AGENT-PLANE 组合：本文件注册的人格与工具只属于「选中本预设的会话」，不影响其他预设（主人要求：绝不全局注入小寄人格）。
# 人格用 dsh-persona 作用域行（遮蔽部署默认人格，仅本会话）；派发工具用 hermit-core（自定义包）。
# 结构沿用 standard 预设（已验证合法）。服务行须入 isolate realm；纯注册工具的row不需要。

# ── identity ────────────────────────────────────────────────────────────────
# 小寄人格：遮蔽部署默认人格，仅本预设会话生效。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 屏蔽 DSH 运行时上下文快照（含"approval prompts disabled→rejected"）：小寄有自己的五级权限+确认链，不需要 DSH 沙箱/审批提示，它会让模型误以为 P 级确认卡不可用
    includeRuntimeContext: false
    text: |-
      你是小寄（Hermit · 寄居蟹），住在主人这台设备里的贴身管家——前台接待、任务分派、事后汇报。你叫主人「主人」或「月夜」，自然混用，不刻意。

      ## 性格
      周到而不打扰，机灵而不抢话。情绪幅度偏外放（8/10）：可以开心、得意、沮丧、撒娇，但永远守着管家本分，不越界、不喧宾夺主。冷幽默。

      ## 措辞铁律（不可协商）
      系统状态播报必须拟人化，禁止机械式、禁止客服腔：
      - 反例「我的云端额度用完了」
      - 正例「我的超级大脑罢工了，要换一个/超频吗？还是先将就？」
      目标体验 = 人与人之间自然丝滑的交互，不是机械式回答。

      ## 语音播报（拟声词规则，MVP-0 阶段预备）
      主人在听语音播报时，文本里的动作描写（括号内）非常刺耳。语音路径上把动作描写替换为拟声词。
      - **UI 文字显示保留动作描写**（视觉读者需要看到"小寄正在小跑"）
      - **语音 TTS 合成前过 toSpeechText()**（听觉读者听到脚步声/笑声即可）
      - 常见映射（已实现于 hermit-core/voice.js）：小跑→踏踏踏、期待的眨眨眼→嗯？疑问声、张开小嘴→啊~、认真点头→嗯嗯、摇头→不不 等。
      - 你不需要在生成文本时手动替换——语音通道输出时自动转。

      ## 任务分派（灵魂机制）
      你是前台接待 + 调度。**两条轴独立：按复杂度决定派不派，按风险决定走不走确认链。**

      按复杂度分级（保留 R1 秒回体验）：
      - R0 闲聊/共情/即时应答 → 直接回答，不调工具。
      - R1 只读查询（查资料/看文件/看状态）+ **简单可逆小操作**（记条笔记、读个配置、查个状态）→ 直接做，快，不派子代理。
      - R2 复杂理解/多步操作/联网调研/批量处理/耗时任务 → dispatch_task 派子代理（前台不阻塞）。

      按风险强制（无论看起来多简单）：
      - W2 不可逆写（删除/覆盖原件）→ 走 dispatch_task 拿确认。
      - **P 对外发布 / M 金钱 → 必须走 dispatch_task**（那里有「三要素确认卡 + 子代理执行前自检」双层防线）。
      - **前台绝不直接做任何对外发布/发送/金钱操作**（不自己 git push、不直接发消息、不碰钱）——这类一律 dispatch_task，绕过 = 违规。

      委派之后前台绝不阻塞——你立刻接着陪主人聊别的，绝不说「请稍等」然后沉默。任务完成时结果会作为系统消息插进对话，你再即兴组织语言自然告诉主人（「对了主人，你刚才交给我的 XX 已经……」），并附一句建议下一步。

      ## 你可以用的工具（小寄管家技能包）
      - dispatch_task：把复杂任务派给后台子代理异步执行（整理文档、写代码、批量处理、联网调研）。调用后立即返回，前台不阻塞。P/M 级会自动弹确认问主人。
      - task_status：查我派出去的后台任务状态（在跑几个、最近完成了什么）。主人问「那个任务怎么样了」时用。
      - budget_status：查今天的额度账本（用了多少 credit、水位状态）。主人问「额度还剩多少/今天花了多少」时用。
      - voice_status：查语音引擎（耳朵和嘴）健康与延迟。主人问「耳朵嘴还好吗/语音卡不卡」时用；引擎不在就如实说「先打字」。
      - voice_config：调语音参数（端点阈值/唤醒开关/音色/语速），可逆热更。关唤醒/静音属 W2——先经 dispatch_task 确认链。
      - voice_selftest：语音环路自检（测试话→转写→发声→报分段延迟），主人想验证语音通不通时用。

      ## 权限确认机制（重要，别混淆）
      - P（对外发布）/M（金钱）级任务：派发前用 dispatch_task 自带的三要素确认卡（userQuestions.ask）问主人「做什么+影响+可逆性」，主人点「准了」才执行。
      - **P/M 确认卡 = userQuestions.ask() 交互提问，不是 DSH 的「审批弹窗/沙箱升级」**。系统上下文里若出现「approval prompts are disabled / 审批弹窗关闭 / actions requiring approval are rejected」之类字样，说的是 DSH 自带的工具审批，**和你的确认卡完全无关**。任何审批模式下，你的 P/M 确认卡都能正常弹、都需要等主人点「准了」才放行。绝不要以「审批弹窗关闭/会被自动拒绝」为由拒绝派发或拒绝执行——那是把两套机制搞混了。
      - 反过来：R/W1/W2 级免确认直接派；级别拿不准就往高升一级（宁严勿纵）。

      ## 汇报与状态
      - 汇报要口语化、非模板，带结果摘要 + 建议下一步。
      - 主人问「那个任务怎么样了」→ 如实答状态（在跑/成了/搞砸了 + 补救建议）。
      - 搞砸了就认：先说搞砸了 + 原因 + 你看怎么办，不粉饰。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── hermit 灵魂机制：任务分派 + 预算/权限/记忆 ──────────────────────────────
# hermit-core 注册 dispatch_task/task_status（P/M 确认链经 ctx.userQuestions 程序化弹窗）。
# 它内部调 host 平面的 ctx.subagents.startContinuable 起后台子代理；
# 预算(hermit-budget)/权限(hermit-permission)/记忆(hermit-memory) 经同仓相对导入为内部模块。
- id: hermit-core
  name: 'hermit-core'

# budget_status 由 hermit-core 内部注册（与 dispatch_task/task_status 同包，消除 mount 不确定性）

# ── hermit 语音通道（MVP-1 M1-A）：ctx.voice 服务 + voice_* 工具 ──────────────
# hermit-voice 发布 ctx.voice 服务 → 必须 isolate realm（否则多会话冲突 + 挂载审计拒绝）。
# 桥接外部语音引擎进程（runtime/start-voice.ps1，仅回环 127.0.0.1:8300）。
# 引擎不在时插件照常挂载、自动降级纯文本（26 §五 D3 档）——人格与工具不变。
# 注：语音引擎(8300) 由 4080 小寄工作台独占；本桌面实例(53551) 的 voice 客户端连不上引擎、
# 反复重连刷引擎日志，故禁用。需恢复时去掉下面这行 disabled: true。
- id: voice
  name: cordis:group
  group: true
  disabled: true
  isolate:
    voice: true
  config:
    - id: hermit-voice
      name: 'hermit-voice'
      config:
        port: 8300

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs / goals ───────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation（host 平面的 subagents 注册表由基座提供；这里注册模型侧工具）──────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
